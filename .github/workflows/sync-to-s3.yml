name: Sync to S3 Knowledge Base

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync repo to S3
        run: aws s3 sync . "s3://${{ secrets.S3_BUCKET }}" --delete --exclude ".git/*" --exclude ".github/*"
      - name: Trigger Knowledge Base ingestion
        run: |
          aws bedrock-agent start-ingestion-job \
            --knowledge-base-id ${{ secrets.KB_ID }} \
            --data-source-id ${{ secrets.KB_DATA_SOURCE_ID }} \
            --region us-east-1
